name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: MyPy type check
        run: python -m mypy src/mac/ --no-error-summary
        continue-on-error: true

      - name: Check import consistency
        run: python -c "import mac; print(mac.__version__)"

  test:
    strategy:
      fail-fast: false
      matrix:
        # Cross-version coverage on Linux (cheap, fast)
        include:
          - { python-version: "3.10", os: ubuntu-latest }
          - { python-version: "3.11", os: ubuntu-latest }
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
          # Cross-platform coverage on the latest supported Python
          - { python-version: "3.12", os: macos-latest }
          - { python-version: "3.12", os: windows-latest }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall -q src examples scripts

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=mac --cov-report=term-missing --cov-report=xml -q --tb=short

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    # Always build a wheel + sdist on push to main so packaging
    # regressions surface immediately rather than at tag time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  bridge-smoke:
    # Exercises the Multica bridge end-to-end via --demo so a broken
    # handler signature (e.g. forgot to add a kwarg) surfaces even when
    # the bridge-specific tests are skipped on this Python/OS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with http extra
        run: pip install -e ".[dev,http]"

      - name: Run bridge --demo
        run: python examples/multica_bridge/server.py --demo
